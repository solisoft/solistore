name: Release

# A tag `vX.Y.Z` on the release commit publishes the crate. The version in
# Cargo.toml must be the tag's: the tag says what was meant, the manifest
# what cargo would ship.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag is the manifest's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "solistore"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version" >&2
            exit 1
          fi
      - run: cargo test --release -p solistore
      - run: cargo publish -p solistore
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
