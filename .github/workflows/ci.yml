name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --profile ci

  # SoliDB builds on 1.91; an engine that needs more would raise its floor.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91
      - run: cargo check --all-targets --all-features

  # The reason this crate exists: no C or C++ toolchain anywhere in the build.
  no-c-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/check_no_c_toolchain.sh

  # Every platform SoliDB ships a binary for.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --profile ci --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-unknown-linux-musl'
      - run: cargo check --all-targets --target ${{ matrix.target }}
        if: matrix.target == 'x86_64-unknown-linux-musl'

  # The benchmark's crash test on NTFS: a writer committing fsynced
  # batches is killed (TerminateProcess) mid-write, twenty times, and the
  # reopened database must hold every acknowledged batch, none of them in
  # part. bench/gate.sh runs the same test a hundred times on Linux.
  crash-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path bench/Cargo.toml --no-default-features --features solistore
      - shell: bash
        run: |
          for i in $(seq 1 20); do
            out=$(bench/target/release/engine-bench.exe crash --engine solistore \
              --label "ntfs-$i" --dir "$RUNNER_TEMP/crash" --secs 3 --sx-buffer-mb 2)
            echo "$out"
            echo "$out" | grep -q '"lost_acked":0,' || { echo "acknowledged batches lost"; exit 1; }
            echo "$out" | grep -q '"torn_batch":false' || { echo "a batch applied in part"; exit 1; }
          done

  # Miri on the tests that cover the unsafe code: the memtable's skiplist
  # and arena, and the cursor reads through it. Undefined behaviour, a data
  # race or a leak fails the job. Sizes are scaled down under cfg(miri).
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo miri setup
      - run: cargo miri test -p solistore --lib -- skiplist memtable

  # The fuzz targets, built and run briefly from an empty corpus: a
  # decoder change that panics on garbage fails here. Long runs are by
  # hand (fuzz/README.md).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: |
          cd fuzz
          for t in log_records write_batch version_edits block bloom table open; do
            # The prebuilt cargo-fuzz is a musl binary and would target musl.
            cargo +nightly fuzz run -O --target x86_64-unknown-linux-gnu "$t" -- \
              -max_total_time=30 -malloc_limit_mb=256
          done

  # The benchmark compiles against both engines; it is never run in CI.
  bench-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path bench/Cargo.toml --no-default-features --features solistore
