[workspace]
resolver = "2"
members = ["crates/solistore"]
# The benchmark and the fuzz targets are their own workspaces: they link
# RocksDB and libFuzzer, and the engine's own build must never pay for that
# C++.
exclude = ["bench", "fuzz"]

[workspace.package]
version = "0.3.2"
edition = "2021"
# SoliDB's floor (rust-rocksdb 0.53 declared it); the engine must not raise it.
rust-version = "1.91"
license-file = "LICENCE.md"
repository = "https://github.com/solisoft/solistore"

[workspace.dependencies]
solistore = { path = "crates/solistore" }

[profile.release]
debug = 1

# What CI runs tests with: optimised enough that crash and property tests
# finish in seconds, without LTO.
[profile.ci]
inherits = "release"
debug = 0
incremental = false
