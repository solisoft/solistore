[package]
name = "solistore"
description = "Embedded LSM key-value store for SoliDB: pure Rust, durable on every commit by default"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENCE.md"
repository.workspace = true
readme = "../../README.md"
keywords = ["lsm", "key-value", "storage-engine", "embedded", "database"]
categories = ["database-implementations"]

[features]
# Entry points for the fuzz targets in fuzz/; not part of the API.
fuzzing = []

[dependencies]
arc-swap = "1"
bytes = "1"
crc32c = "0.6"
# Epoch reclamation for the block cache's lock-free hits (sst/cache.rs):
# pure Rust.
crossbeam-epoch = "0.9"
# Block-format LZ4, pure Rust. Without the default `safe-*` features it uses
# its faster unchecked paths; input is checksummed before it is decoded.
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
parking_lot = "0.12"
# The block cache: sharded, weighted by bytes, pure Rust.
quick_cache = { version = "0.6", default-features = false, features = ["parking_lot"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# sync_file_range for incremental table write-back: bindings only, no C build.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The commit queue's model checks, under `cargo test` only:
# RUSTFLAGS="--cfg loom" cargo test --release --lib loom_tests. A dev
# dependency: loom's `generator` builds C, which the engine's own graph must
# not (scripts/check_no_c_toolchain.sh).
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dev-dependencies]
proptest = "1"
rand = "0.8"
tempfile = "3"
