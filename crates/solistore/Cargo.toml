[package]
name = "solistore"
description = "Embedded LSM key-value store for SoliDB: pure Rust, durable on every commit by default"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
crc32c = "0.6"
crossbeam-skiplist = "0.1"
parking_lot = "0.12"

[dev-dependencies]
proptest = "1"
rand = "0.8"
tempfile = "3"
